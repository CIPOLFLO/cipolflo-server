name: ci

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ejecutar tests unitarios
        working-directory: server
        run: ./gradlew test

      - name: Publicar resultados de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: server/build/reports/tests/test/

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    # TODO: activar cuando se configure el source set de integración en Gradle

    steps:
      - name: Tests de integración pendientes de configurar
        run: echo "Se habilitaran cuando se configure Testcontainers y el source set integrationTest en Gradle"

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache SonarCloud
        uses: actions/cache@0057852bfaa89a56745caa8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analizar con SonarCloud
        working-directory: server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew test jacocoTestReport sonar
