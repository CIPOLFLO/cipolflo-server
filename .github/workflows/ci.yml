 name: ci

 on:
   pull_request:
     branches:
       - develop
       - main
     types: [opened, synchronize, reopened]

 jobs:
   unit-tests:
     name: unit-tests
     runs-on: ubuntu-latest

     steps:
       - name: Checkout código
         uses: actions/checkout@v4

       - name: Configurar JDK 21
         uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
         with:
           java-version: '21'
           distribution: 'zulu'

       - name: Cache Gradle
         uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
         with:
           path: ~/.gradle/caches
           key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
           restore-keys: ${{ runner.os }}-gradle

       - name: Ejecutar tests unitarios
         run: ./gradlew test

       - name: Publicar resultados de tests
         uses: actions/upload-artifact@v4
         if: always()
         with:
           name: unit-test-results
           path: build/reports/tests/test/

   integration-tests:
     name: integration-tests
     runs-on: ubuntu-latest

     steps:
       - name: Tests de integración pendientes de configurar
         run: echo "Se habilitaran cuando se configure Testcontainers y el source set integrationTest en Gradle"

   sonarqube:
     name: sonarqube
     runs-on: ubuntu-latest
     needs: [unit-tests]
     permissions:
       contents: read
       pull-requests: read
       issues: read

     steps:
       - name: Checkout código
         uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
         with:
           fetch-depth: 0

       - name: Configurar JDK 21
         uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
         with:
           java-version: '21'
           distribution: 'zulu'

       - name: Cache SonarQube
         uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
         with:
           path: ~/.sonar/cache
           key: ${{ runner.os }}-sonar
           restore-keys: ${{ runner.os }}-sonar

       - name: Cache Gradle
         uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
         with:
           path: ~/.gradle/caches
           key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
           restore-keys: ${{ runner.os }}-gradle

       - name: Build, test y análisis de SonarQube
         env:
           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           PR_NUMBER: ${{ github.event.pull_request.number }}
           PR_BRANCH: ${{ github.head_ref }}
           PR_BASE: ${{ github.base_ref }}
         run: >
           ./gradlew build sonar --info
           -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
           -Dsonar.pullrequest.branch=${{ github.head_ref }}
           -Dsonar.pullrequest.base=${{ github.base_ref }}
