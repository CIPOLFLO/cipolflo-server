spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.liquibase.enabled=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
cors.allowed-origins=http://localhost:4200
auth0.issuer=https://test-tenant.us.auth0.com/
auth0.audience=https://test-api-identifier
azure.document-intelligence.endpoint=https://test.cognitiveservices.azure.com
azure.document-intelligence.key=test-key

# Mail: host dummy para que se autoconfigure el JavaMailSender. Los tests no env�an.
spring.mail.host=localhost
spring.mail.port=3025
cipolflo.mail.from=test@cipolflo.com
cipolflo.mail.nombre-remitente=CIPOLFLO TEST

# Spring AI: solo el modelo de chat esta habilitado (ver application.properties).
# Key dummy: los tests no le pegan al proveedor real, pero Spring AI la valida
# como no vacia al construir el bean del ChatModel al arrancar el contexto.
spring.ai.model.chat=openai
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.embedding=none
spring.ai.openai.api-key=test-key