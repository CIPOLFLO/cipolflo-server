# Base de datos
# Las credenciales se leen desde variables de entorno — ver .env.example
spring.datasource.url=jdbc:postgresql://localhost:5433/CIPOLFLO_BD
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# none: Liquibase gestiona el schema — Hibernate no lo toca.
spring.jpa.hibernate.ddl-auto=none

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Nombre de la app
spring.application.name=cipolflo-server

# Puerto
server.port=8080

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

auth0.issuer=${AUTH0_ISSUER_URI}
auth0.audience=${AUTH0_AUDIENCE}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Serialización de fechas
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

#export
cipolflo.export.max-filas=50000
cipolflo.export.max-bytes=10485760


# Azure Document Intelligence
azure.document-intelligence.endpoint=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
azure.document-intelligence.key=${AZURE_DOCUMENT_INTELLIGENCE_KEY}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# Mail (SMTP)
# Las credenciales se leen desde variables de entorno — ver .env.example
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente de la aplicaci�n (usado por EmailService)
cipolflo.mail.from=${MAIL_USERNAME}
cipolflo.mail.nombre-remitente=CIPOLFLO

# Tareas programadas
# Reporte semanal de reservas: lunes 08:00 (hora de Uruguay).
# Los destinatarios (reporte semanal y avisos de cancelacion a administracion) se
# configuran desde Ajustes > Destinatarios de notificacion por email, no aca. Sin
# destinatarios activos, la tarea corre pero no envia (queda registrada como omitida).
cipolflo.reportes.reservas-semanal.cron=0 0 8 * * MON
cipolflo.reportes.reservas-semanal.zona=America/Montevideo

# Purga de logs de envio de emails: domingos 05:00 (hora de Uruguay).
cipolflo.tareas.limpieza-logs-email.cron=0 0 5 * * SUN
cipolflo.tareas.limpieza-logs-email.zona=America/Montevideo
cipolflo.tareas.limpieza-logs-email.retencion-dias=90

# Cancelacion automatica de reservas pendientes vencidas: todos los dias 00:10 (hora de
# Uruguay), 10 min despues de transicion-estado-reservas (00:00) para no encolarse detras
# de ella (un unico hilo corre todas las @Scheduled, ver SchedulingConfig).
# Nota: con un plazoConfirmacion de VEINTICUATRO_HORAS, un cron diario puede dejar la
# reserva cancelada hasta ~24hs despues de vencido el plazo (ver docs/tareas-programadas.md).
# Aceptado por negocio: la fechaEntrada normalmente no lleva hora, asi que ese margen es ok.
cipolflo.tareas.cancelacion-automatica-reservas.cron=0 10 0 * * *
cipolflo.tareas.cancelacion-automatica-reservas.zona=America/Montevideo

# Transicion de estados de reservas por fecha: todos los dias 00:00 (hora de Uruguay).
cipolflo.tareas.transicion-estado-reservas.cron=0 0 0 * * *
cipolflo.tareas.transicion-estado-reservas.zona=America/Montevideo

# Inactivacion automatica de socios morosos: primer dia de cada mes 03:00 (hora de Uruguay).
cipolflo.tareas.inactivacion-socios.cron=0 0 3 1 * *
cipolflo.tareas.inactivacion-socios.zona=America/Montevideo

# Limpieza de reservas viejas (y sus finanzas asociadas) y de finanzas sueltas vencidas:
# trimestral, 1 de enero/abril/julio/octubre a las 04:00 (hora de Uruguay).
# 04:00 en vez de 03:00 para no coincidir con inactivacion-socios: ambas caen el dia 1 y
# Spring corre las @Scheduled en un unico hilo (ver SchedulingConfig), asi que si compartieran
# horario una quedaria encolada esperando a la otra.
# Los anios de retencion NO se configuran aca: se leen de la tabla configuracion_tarea.
cipolflo.tareas.limpieza-reservas-finanzas.cron=0 0 4 1 1,4,7,10 *
cipolflo.tareas.limpieza-reservas-finanzas.zona=America/Montevideo

# Telegram
# Las credenciales se leen desde variables de entorno - ver .env.example
cipolflo.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
cipolflo.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}

# Spring AI - proveedor Groq via API compatible con OpenAI
# El starter de OpenAI autoconfigura ademas modelos de audio, imagen, moderacion
# y embeddings, todos exigiendo la api-key al arrancar aunque no se usen. Se
# deshabilitan aca porque el bot solo necesita chat (con tool calling).
spring.ai.model.chat=openai
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.embedding=none

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.2

# Memoria conversacional del asistente (por chat)
cipolflo.mensajeria.memoria.max-mensajes=20
cipolflo.mensajeria.memoria.ttl-inactividad=30m
