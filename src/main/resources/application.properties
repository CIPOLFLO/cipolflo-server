
# Base de datos
# Las credenciales se leen desde variables de entorno — ver .env.example
spring.datasource.url=jdbc:postgresql://localhost:5433/CIPOLFLO_BD
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# validate: Hibernate verifica que el schema coincida con las entidades pero no lo modifica.
# El schema se gestiona manualmente con docker/init.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Nombre de la app
spring.application.name=cipolflo-server

# Puerto
server.port=8080
