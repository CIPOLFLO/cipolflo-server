
# Base de datos
# Las credenciales se leen desde variables de entorno — ver .env.example
spring.datasource.url=jdbc:postgresql://localhost:5433/CIPOLFLO_BD
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# validate: Hibernate verifica que el schema coincida con las entidades pero no lo modifica.
# El schema se gestiona manualmente con docker/init.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Nombre de la app
spring.application.name=cipolflo-server

# Puerto
server.port=8080

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

auth0.issuer=${AUTH0_ISSUER_URI}
auth0.audience=${AUTH0_AUDIENCE}

# Serialización de fechas
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
