# Base de datos
# Las credenciales se leen desde variables de entorno — ver .env.example
spring.datasource.url=jdbc:postgresql://localhost:5433/CIPOLFLO_BD
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# none: Liquibase gestiona el schema — Hibernate no lo toca.
spring.jpa.hibernate.ddl-auto=none

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Nombre de la app
spring.application.name=cipolflo-server

# Puerto
server.port=8080

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

auth0.issuer=${AUTH0_ISSUER_URI}
auth0.audience=${AUTH0_AUDIENCE}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Serialización de fechas
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

#export
cipolflo.export.max-filas=50000
cipolflo.export.max-bytes=10485760


# Azure Document Intelligence
azure.document-intelligence.endpoint=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
azure.document-intelligence.key=${AZURE_DOCUMENT_INTELLIGENCE_KEY}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
